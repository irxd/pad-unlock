name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build
          cmake -S . -B build-debug -DPADUNLOCK_DEBUG=ON
          cmake --build build-debug
          cp build-debug/padunlock.skprx build-debug/padunlock-debug.skprx
      - uses: actions/upload-artifact@v4
        with:
          name: padunlock
          path: |
            build/padunlock.skprx
            build-debug/padunlock-debug.skprx
